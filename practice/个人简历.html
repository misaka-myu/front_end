<!DOCTYPE>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>个人简历</title>
</head>
<body>
    <h1 align="center">个人简历</h1>
    <table border="3" align="center">
        
        <tbody>
            <tr>
                <td>姓名</td>
                <td width="100"></td>
                <td>性别</td>
                <td width="100"></td>
                <td rowspan="5" width="100">照片</td>
            </tr>
            <tr>
                <td>出生年月</td>
                <td width="100"></td>
                <td>籍贯</td>
                <td width="100"></td>
            </tr>
            <tr>
                <td>政治面貌</td>
                <td width="100"></td>
                <td>民族</td>
                <td width="100"></td>

            </tr>
            <tr>
                <td>健康状况</td>
                <td width="100"></td>
                <td>婚姻状况</td>
                <td width="100"></td>

            </tr>
            <tr>
                <td>联系电话</td>
                <td width="100"></td>
                <td>电子邮箱</td>
                <td width="100"></td>
            </tr>
            <tr>
                <td>求职意向</td>
                <td colspan="4"></td>
            </tr>
            <tr>
                <td height="400">工作经历</td>
                <td colspan="4"></td>
            </tr>
            <tr>
                <td>计算机水平</td>
                <td colspan="4"></td>
            </tr>
            <tr>
                <td>自我评价</td>
                <td colspan="4"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
