    <h1>古诗词鉴赏</h1>

    <h2>静夜思</h2>
    <a href="https://baike.baidu.com/item/%E6%9D%8E%E7%99%BD/1043" target="_blank">李白</a>
    <p>
        窗前明月光，<br>

        疑是地上霜， <br>

        举头望明月， <br>

        低头思故乡。 <br>

    </p>
    《静夜思》的具体创作时间和地点历来有不同说法，较常见的一种观点认为， <br> 它写于唐玄宗开元十四年（公元726年）左右，当时李白年轻，在外游历，夜晚面对明月产生了思乡之情。
