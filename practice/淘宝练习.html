<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝练习</title>
</head>
<body>
    <img src="https://img.alicdn.com/imgextra/i1/O1CN011YZ3P01zMCE6HGyhk_!!6000000006699-2-tps-480-144.png" alt="淘宝网">
    <br>
    <form action="">
        姓名：<input type="text">
        <br>
        登录名：<input type="text">（可包含a-z,0-9和下划线）
        <br>
        密码：<input type="password">(至少包含6个字符)
        <br>
        确认密码：<input type="password">
        <br>
        性别：
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女
        爱好:
        <input type="checkbox" name="hobby"> 运动
        <input type="checkbox" name="hobby"> 聊天
        <input type="checkbox" name="hobby"> 玩游戏
        <br>
        职业:
        <select name="career">
            <option value="1">工程师</option>
            <option value="2">学生</option>
            <option value="3">老师</option>
        </select>
        <br>
        <strong>阅读淘宝网协议</strong>
        <br>
        <textarea name="protocal">
            淘宝平台服务协议
        </textarea>
        <br>
        <input type="checkbox" name="read"> 已阅读条款
        <br>
        <input type="reset" value="重填">
        <input type="submit" value="提交注册信息" disabled>
    </form>
</body>
</html>
