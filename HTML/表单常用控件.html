<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        账户：<input type="text" name="account" value="abc123"> 
        <br>
        密码： <input type="password" name="pwd" value="abc123"> <br>
        性别： 
        <input type="radio" name="gender"  value="male" checked> 男
        <input type="radio" name="gender" value="female"> 女
        <br>
        <input type="checkbox" name="hobby" value="smoke" checked> 抽烟
        <input type="checkbox" name="hobby" value="drink"> 喝酒
        <input type="checkbox" name="hobby" value="perm" checked> 烫头
        <br>
        <input type="hidden" name="hided" value="hahaha">
        其他：<textarea name="other" cols="20" rows="3"></textarea>
        <br>
        籍贯：
        <select name="place" id="">
            <option value="冀">河北</option>
            <option value="豫" selected>河南</option>
            <option value="沪">上海</option>
            <option value="京">北京</option>
            <option value="津">天津</option>
            
        </select>
        <br>
        <!-- 确认按钮第一种写法 -->
        <!-- <button>确定</button> -->
        <!-- 确认按钮的第二种写法 -->
        <input type="submit" value="确认">
        <!-- 重置按钮的第一种写法 -->
        <!-- <button type="reset">重置</button> -->
        <!-- 重置按钮的第二种写法 -->
        <input type="reset" value="点我重置">
        <button type="button">检查账户是否注册</button>

        
    </form>
</body>

</html>
