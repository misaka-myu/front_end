<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单_field和legand</title>
</head>

<body>

    <form action="">
        <!-- 主要信息 -->
        <fieldset>
            <legend>主要信息</legend>
            <!-- label for属性中的内容是id的值,用来做关联 -->
            <!-- 写法一
        <label for="zhanghu">账户：</label>
        <input id="zhanghu" type="text" name="account" >  -->
            <!-- 写法二 -->
            <label>
                账户:
                <input type="text" name="accout">
            </label>
            <br>
            <label for="mima">密码:</label>
            <input id="mima" name="pwd">
            <br>
            性别：
            <input type="radio" name="gender" value="male" id="nan">
            <label for="nan">男</label>
            <input type="radio" name="gender" value="female" id="nv">
            <label for="nv">女</label>
        </fieldset>
        <br>
        <!-- 附加信息 -->
        <fieldset>
            <legend>附加信息</legend>
            <label>
                <input type="checkbox" name="hobby" value="smoke"> 抽烟
            </label>
            <label>
                <input type="checkbox" name="hobby" value="drink"> 喝酒
            </label>
            <label>
                <input type="checkbox" name="hobby" value="perm"> 烫头
            </label>

            <br>
            <input type="hidden" name="hided" value="hahaha">
            <label>
                其他：<textarea name="other" cols="20" rows="3"></textarea>
            </label>
            <br>
            籍贯：
            <select name="place" id="">
                <option value="冀">河北</option>
                <option value="豫" selected>河南</option>
                <option value="沪">上海</option>
                <option value="京">北京</option>
                <option value="津">天津</option>

            </select>
        </fieldset>

        <br>
        <input type="submit" value="确认">
        <input type="reset" value="点我重置">
        <button type="button">检查账户是否注册</button>


    </form>
</body>

</html>
