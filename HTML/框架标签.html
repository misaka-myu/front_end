    <!-- iframe是一个行内元素 -->
    <!-- 与a标签的target属性配合使用 -->
    <a href="https://www.toutiao.com" target="tt">去头条</a>
    <a href="https://www.taobao.com" target="tt">去淘宝</a>
    <br>
    <iframe  name="tt" frameborder="0" width="300" height="500" ></iframe>
    <!-- 与form表单的targe属性配合使用 -->
    <form action="https://www.taobao.com" target="tt">
        <button type="submit">点我去淘宝</button>
    </form>
    <form action="https:search.jd.com/Search" target="tt">
