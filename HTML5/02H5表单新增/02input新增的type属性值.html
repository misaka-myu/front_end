<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input新增的type属性值</title>
</head>
<body>
    <!-- <input type="text">
    <input type="password">
    <input type="checkbox">
    <input type="radio">
    <input type="submit">
    <input type="reset">
    <input type="button"> -->
    <form action="#">
        邮箱: <input type="email" name="email">
        <br>
        网址: <input type="url" name="url">
        <button>提交</button>
        <br>
        数值: <input type="number" name="number" step="2" max="80" min="20">
        搜索: <input type="search" name="search">
        电话: <input type="tel" name="phone"> 
        范围: <input type="range" max="80" min="40" value="50">
        颜色选择器: <input type="color" value="color">
        日期选择框: <input type="date">
        月份: <input type="month">
        周: <input type="week">
        时间: <input type="time">
        日期加时间: <input type="datetime-local">
         
        <!-- 主要作用于移动端 -->
    </form>
</body>
</html>
