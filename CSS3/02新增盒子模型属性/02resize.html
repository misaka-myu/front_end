<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resize</title>
    <style>
        .box1 {
            width: 100px;
            height: 400px;
            background-color: orange;
            resize: vertical; /* both vertical*/
            overflow: hidden;
        }
        .box2 {
            width: 100px;
            height: 600px;
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="box2">123</div>
    </div>
</body>
</html>
