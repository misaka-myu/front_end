<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-shadow</title>
    <style>
        .box1 {
            margin: 0 auto;
            width: 400px;
            height: 400px;
            background-color: orange;
            margin-top: 100px;
            font-size: 40px;
            line-height: 400px;
            text-align: center;
            /* 写两个值,含义 第一个值:水平位置,第二个值: 垂直位置*/
            /* box-shadow: 10px 10px; */
            /* 写三个值,第三个值就是阴影的颜色 */
            /* box-shadow: 10px 10px blue; */
            /* 这里的第三个值指的是阴影的模糊程度 */
            /* box-shadow: 10px 10px 10px; */
            /* 写四个值的情况 */
            /* box-shadow: 10px 10px 10px blue; */
            /* 写五个值的情况 */
            /* 含义:水平位置,垂直位置,模糊程度,外延值,阴影颜色*/

            /* box-shadow: 10px 10px 20px 0px blue; */
            /* 写六个值的情况,含义:水平位置,垂直位置,模糊程度,外延值,阴影颜色,内阴影 */
            box-shadow: 0px 0px 20px 10px red inset;

        }
    </style>
</head>
<body>
    <div class="box1">
        你好呀
    </div>
</body>
</html>
