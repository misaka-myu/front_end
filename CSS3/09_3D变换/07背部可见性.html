<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多重变换</title>
    <style>
        .outer {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 0 auto;
            margin-top: 100px;
            /* 开启3D空间 */
            transform-style: preserve-3d;
            /* 设置景深,有了透视效果(近大远小) */
            perspective: 500px;
            /* 设置透视点的位置 */
            perspective-origin: 100px 100px;

        }

        .inner {
            width: 200px;
            height: 200px;
            background-color: rgba(135, 207, 235, 0.568);
            /* transform: scaleZ(2) rotateY(45deg); */
            /* transform: scale3d(1.5,1.5,4) rotateY(45deg); */
            /* transform: translateX(50px) translateY(50px); */
            /* transform: translate(50px, 50px); */
            /* transform: rotateX(30deg); */
            /* transform: translateZ(200px); */
            /* transform: translate3d(0, 0, 100px); */
            /* transform: rotateX(45deg); */
            /* transform: rotateY(0deg); */
            /* transform: rotate3d(30deg,30deg,30deg); */
            /* transform: translateZ(100px) scaleZ(1) rotate(45deg); */
            backface-visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner">
            你好呀
        </div>
    </div>
</body>

</html>
