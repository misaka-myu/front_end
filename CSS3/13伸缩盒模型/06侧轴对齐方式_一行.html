<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侧轴对齐方式_一行</title>
    <style>
        .outer {
            width: 1000px;
            height: 600px;
            background-color: #888;
            /* 将该容器变成了伸缩容器(开启了flex布局) */
            display: flex;
            margin: 0 auto;
            /* 伸缩盒相关属性start */
            /* 调整主轴的方向 水平从左到右,默认值*/
            flex-direction: row;
            /* 调整主轴的方向,水平从右到左 */
            /* flex-direction: row-reverse; */
            /* 调整主轴方向,垂直从上到下 */
            /* flex-direction: column; */
            /* 调整主轴方向,垂直从下到上 */
            /* flex-direction: column-reverse; */
            /* 主轴换行方式 */
            flex-wrap: wrap;
            /* 主轴的对齐方式,起始位置 默认值*/
            justify-content: flex-start;
            /* 主轴的对齐方式,结束位置 */
            /* justify-content: flex-end; */
            /* 主轴的对齐方式,项目均匀的分布在一行中,项目与项目之间的距离,是项目距边缘的二倍 */
            /* justify-content: space-around; */
            /* 主轴的对齐方式,项目均匀的分布在一行中,项目与项目之间的距离是相等的,项目距边缘没有距离 */
            /* justify-content: space-between; */
            /* 主轴的对齐方式,项目均匀的分布在一行中 */
            /* justify-content: space-evenly; */
            /* 侧轴的对齐方式,侧轴的起始位置对齐 */
            /* align-items: flex-start; */
            /* 侧轴的对齐方式,侧轴的结束位置对齐 */
            /* align-items: end; */
            /* 侧轴的对齐方式,侧轴的中间位置对齐 */
            /* align-items: center; */
            /* 侧轴的对齐方式,侧轴的结束位置对齐 */
            /* align-items: baseline; */
            /* 侧轴的对齐方式,侧轴的结束位置对齐 */
            /* 这个stretch属性值只在所有伸缩项目没有高度的时候生效,拉伸到整个父容器(前提:伸缩项目不能给高度) ,默认 */
            align-items: stretch;
        }

        .inner {
            width: 200px;
            height: 200px;
            border: 1px solid black;
            background-color: skyblue;
            box-sizing: border-box;
        }

        .inner2 {
            height: 300px;
            font-size: 80px;
        }

        .inner3 {
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner">1x</div>
        <div class="inner inner2">2x</div>
        <div class="inner inner3">3x</div>

    </div>
</body>

</html>
