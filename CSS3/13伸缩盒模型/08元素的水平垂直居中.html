<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08元素的水平垂直居中</title>
    <style>
        .outer {
            width: 400px;
            height: 400px;
            background-color: #888;
            display: flex;
            /* 元素水平垂直居中的方案一 */
            /* justify-content: center; */
            /* align-items: center; */

        }
        .inner {
            width: 100px;
            height: 100px;
            background-color: orange;
            /*
                 元素水平垂直居中的方案二 
                父元素开启flex弹性布局,子元素开启margin:auto;
            */
            margin: auto; 

        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">

        </div>
    </div>
</body>
</html>
