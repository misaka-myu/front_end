<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位移</title>
    <style>
        .outer {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 0 auto;
            margin-top: 100px;
        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: skyblue;
            /* transform: translateX(50px) translateY(50px); */
            /* 通过关键词来调整变换原点 */
            /* transform-origin: left top; */
            transform: rotate(0deg);
            /* transform: translate(50px,50px); */
            /* 通过具体像素值来调整变换原点 */
            /* transform-origin: 50px 50px; */
            /* 通过百分比调整变换原点 */
            /* transform-origin:25% 25% ; */
            /* 只给一个值 */
            transform-origin:left ;
            /* 变换原点位置的改变对原点是有影响的 */
            /* 变换原点的位置对于缩放是有影响的 */
            transform: scale(0.5);
            /* 变换原点位置的改变对于位移是没有影响的 */
             
        }
    </style>
</head> 
<body>
    <div class="outer">
        <div class="inner">
                你好呀
        </div>
    </div>
</body>
</html>
