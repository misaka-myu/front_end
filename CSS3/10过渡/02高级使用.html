<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级使用</title>
    <style>
        .outer {
            width: 1300px;
            height: 900px;
            border: 1px solid black;
        }

        .outer:hover .box {
            width: 1300px;

        }

        .box {
            width: 200px;
            height: 100px;



            /* 设置哪个属性需要过渡效果 */
            /* transition: height,width,background-color; */
            /* 让所有能过渡的属性都过渡 */
            transition-property: all;
            /* 设置过渡时间 */
            /* 分别设置过渡时间 */
            /* transition-duration: 1s ,5s,3s; */
            /* 设置一个过渡时间,所有人都用*/
            transition-duration: 5s;
            /* 过渡的延迟 */
            /* transition-delay: 2s; */

        }

        .box1 {
            background-color: skyblue;
            transition-timing-function: ease;
        }

        .box2 {
            background-color: orange;
            transition-timing-function: linear;

        }

        .box3 {
            background-color: gray;
            transition-timing-function: ease-in;

        }

        .box4 {
            background-color: tomato;
            transition-timing-function: out;

        }

        .box5 {
            background-color: green;
            transition-timing-function: ease-in-out;

        }

        .box6 {
            background-color: purple;
            transition-timing-function: step-start;

        }

        .box7 {
            background-color: yellow;
            transition-timing-function: step-end;
        }

        .box8 {
            background-color: chocolate;
            transition-timing-function: steps(20,start);
        }

        .box9 {
            background-color: black;
            /* transition-timing-function: ; */
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="box box1">ease (慢,块,慢)</div>
        <div class="box box2">linear (匀速的)</div>
        <div class="box box3">ease-in(先慢后快)</div>
        <div class="box box4">ease-out(先快后慢)</div>
        <div class="box box5">ease-in-out(慢快慢)</div>
        <div class="box box6">step-start不考虑过渡的时间,直接就是终点</div>
        <div class="box box7">step-end 考虑过渡时间,但是没有过渡的效果</div>
        <div class="box box8">steps 分步的进行过渡,具体分几步需要结合所提供的值</div>
        <div class="box box9">无敌的贝塞尔曲线</div>

    </div>

</body>

</html>
