<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本使用</title>
    <style>
        .box1 {
            width: 200px;
            height: 200px;
            background-color: orange;
            opacity: 0.5;
            
            /* 设置哪个属性需要过渡效果 */
            /* transition: height,width,background-color; */
            /* 让所有能过渡的属性都过渡 */
            transition-property: all;
            /* 设置过渡时间 */
            /* 分别设置过渡时间 */
            /* transition-duration: 1s ,5s,3s; */
            /* 设置一个过渡时间,所有人都用*/
            transition-duration: 1s;
        }
        .box1:hover {
            height: 400px;
            width: 400px;
            background-color: green;
            transform: rotateX(45deg);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
</body>
</html>
