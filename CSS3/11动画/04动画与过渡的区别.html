<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画与过渡的区别</title>
    <style>
        .outer {
            width: 1000px;
            height: 200px;
            border:  1px solid black;
        }
        .outer:hover .inner1 {
             transform: translate(900px);
        }
        .inner {
            width: 100px;
            height: 100px;

        }
        /* 用过渡实现,inner1跑到右边去*/
        .inner1 {
            background-color: orange;
            transition:  3s linear;
        }
        /* 用动画实现inner2跑到右边去 */
        @keyframes anime {
            from {

            }   
            to {
                transform: translate(900px);
            }

        }
        .inner2 {
            background-color: green;
            animation: anime  3s linear forwards;
        }
        /* 
            动画和过渡的区别
                -动画是可以不需要任何的触发条件
                -过渡必须要有触发条件



        
        
        */
    </style>
</head>
<body>
    <div class="outer"> 
        <div class="inner inner1">过渡</div>
        <div class="inner inner2">动画</div>
    </div>
</body>
</html>
