<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
    <script>
        /* 
                Math
                    -Math一个工具类
                    -Math中为我们提供了数学运算相关的一些常亮和方法
                    -常量:
                        Math.PI 圆周率
                    -方法
                    Math.abs()求一个数的绝对值
                    Math.min() 求多个值中的最小值
                    Math.max()求多个值中的最大值
                    Math.pow()求x的y次幂 //等价于 4 ** 2
                    Math.sqrt() 等价于一个数的平方根
                    // 取整的四种方式
                    Math.floor() //向下取整
                    Math.ceil() //向上取整
                    Math.round() //四舍五入
                    Math.trunc() //直接去除小数位

                    Math.random() 生成一个0~1的随机数,伪随机数
                    生成0 ~ x之间的随机数
                        Math.round(Math.random() * x)
                        Math.floor(Math.random() *(x + 1))

                    生成 x - y之间的随机数
                        Math.round(Math.random() * (y - x) + x)


        */
    </script>
