    <title>正则表达式</title>
    <script>
        /* 
            量词
                {m} 表示正好m个，只对前面的一个起作用
                {m,} 至少m个
                {m,n} m-n个
                +表示一个以上,相当于{1,}
                *表示任意数量的a
                ? 0-1次相当于{0,1}
        */
        let re = /a{20}/; //
        re = /^(ab){3}/
        re = /^[a-z]{3}$/
        re = /^[a-z]{1,}$/ //表示一个以上的字母
        re = /^[a-z]{1,3}$/
        re = /^ba+/ //至少1个a
        re = /^ba*/
        re = /^ba?/

    </script>
