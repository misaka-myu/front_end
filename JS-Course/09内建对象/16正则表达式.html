<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式</title>
    <script>
        let str = "abcaecafcadc";
        //提取出str符合axc的内容
        // g表示全局匹配
        let re = /a(([a-z])c)/ig;
        let result = re.exec(str)
        while(result){
            console.log(result[0],result[1],result[2]); //result[0]是第一次匹配到的内容,result[1]是第二次括号匹配到的内容,result[2]是第三次括号匹配到的内容
            result = re.exec(str)    
        }
        

         


    </script>
</head>

</body>
</html>
