<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式</title>
    <script>
        /* 
            正则表达式
                -正则表达式用来定义一个描述字符串的规则
                -通过这个规则计算机可以检查一个字符串是否符合规则
                    或者将字符串中符合规则的内容提取出来
                -正则表达式也是JS中的一个对象
                    所以要使用正则表达式,要使用正则表达式的对象
                

        */
        // 可以接受两个参数(字符串) 1.正则表达式 2.匹配模式   
        let reg = new RegExp("a","i") //通过构造函数来创建正则表达式对象
        // 使用字面量来创建正则表达式: /正则/匹配模式
        reg = /a/i
        console.log(reg) //输出结果是object
        reg = new RegExp("a"); //检查一个字符串中是否含有a
        // 通过正则表达式,来检查一个字符串是否符合规则
        let str = "abc"
        reg.test(str) //如果符合规则则返回true,如果不符合规则则返回false



    </script>
</head>

<body>

</body>

</html>
