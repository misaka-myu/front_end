<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <script>
        /* 
                Map
                    -Map用来存储键值对的结构(key-value)
                    -Object 中存储的数据可以认为是一种键值对结构
                    -Map和Object的主要区别:
                        -Object中的属性名只能是字符串或符号,如果传递了一个其他类型的属性名
                        -JS解释器会自动将其转换为字符串
                        -Map中任何类型的值都可以称为数据的key
                    -作用和对象类似,主要
        */
        const obj = {
            name: '孙悟空',
            age: 18
        }
        //    创建一个Map
        /* 
            创建,直接调用new Map()
            属性和方法:
                map.size() 获取map中键值对的数量
                map.set(key,value)向map中添加键值对
                map.get(key)获取map中的键值对
                map.delete(key)删除指定key的数据
                map.has(key)检查map中是否包含指定的键
                map.clear() 删除全部的键值对
        */
        const map = new Map()
        console.log(map);
        map.set('name','孙悟空')
        map.set(NaN,'哈哈哈')
        console.log(map.get('name'));
        map.delete(NaN);
        map.clear()
    </script>
</head>

<body>

</body>

</html>
