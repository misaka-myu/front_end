<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾回收</title>
    <script>
        /* 
            垃圾回收(GC) (Garbage collection)
            -和生活一样,生活时间长了以后会产生垃圾  
                程序运行一段时间后也会产生垃圾
            -在程序的世界中什么是垃圾
                如果一个对象没有任何的变量对其进行引用,那么这个对象就是一个垃圾
                垃圾对象的存在会严重影响程序的性能
                在js中有自动的垃圾回收机制,这些垃圾对象会被解释器自动回收,我们无需手动处理
                对于垃圾回收来说我们唯一能做的事情,就是将不再使用的对象设置为null
                

        
        */
       let obj = {name:"孙悟空",age:18};
       obj = null;

    </script>
</head>
<body>
    
</body>
</html>
