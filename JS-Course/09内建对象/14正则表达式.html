<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式</title>
    <script>
        /* 
            1.在正则表达式中大部分字符都可以直接写
            2.| 在正则表达式中表示或
            3.[]表示或(字符集)
                [a - z] 表示任意的小写字母
                [A - Z]表示任意的大写字母
                [a-zA-Z]表示任意的字母
                [0-9] 表示任意数字
                [a-zA-Z0-9]
            4.[^] 表示除了
                [^a-z] 除了所有的小写字母
            5. .表示除了换行符以外的任意字符
            6.在正则表达式中使用\作为转义字符
            7.其他的字符集
                \w  //任意的单词字符 等价于[A-Za-z0-9_]
                \W   //除了单词字符相当于[^A-Za-z0-9_]
                \d //任意数字[0-9]
                \D //除了数字[^0-9]
                \s //空格
                \S //除了空格
                \b //单词边界
                \B //除了单词边界
            8. 开头和结尾
                ^表示字符串的开头
                $表示字符串的结尾

        */
        //    let re = /a/
        let re = /a | b/ //检查字符串中有a或者有b        
        re = /[ab]/ //表示a或b都行 
        re = /[a-z]/ //表示a到z都可以
        re = /[a-z]/i //匹配模式i表示忽略大小写
        re = /./
        re = /\./ //表示只匹配.其他的不匹配
        re = /^a/ //表示匹配开始位置的a
        re = /a$/  //表示以a结尾，或匹配结束位置的a
        re = /^a$/ //只匹配字母a,完全匹配，要求字符串必须和正则完全一致

        let result = re.test("abc")
        console.log(result);

    </script>
</head>

</html>
