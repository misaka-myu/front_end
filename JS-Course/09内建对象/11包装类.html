<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包装类</title>
    <script>
        /* 
            在JS中,除了直接创建原始值以外,也可以创建原始值的对象
            通过new String() 可以创建String类型的对象
            通过new Number() 可以创建number类型的对象
            通过new Boolean() 可以创建Boolean类型的对象
                但是千万不要这么做
            包装类:
                JS中一共有5个包装类
                String --> 字符串包装为String()对象
                Number --> 数值包装为Number对象
                Boolean --> 布尔值包装为Boolean对象
                BigInt-->大整数包装为BigInt类型的对象
                Symbol--> 符号包装我Symbol对象
                -通过包装类可以将一个原始值包装成一个对象
                     当我们对一个原始值调用方法和属性时,JS解释器会临时将原始值包装为对应的对象
                        然后调用这个属性或方法
                -由于原始值会被临时转换为对应的对象,这就意味着对象中的方法都可以直接通过原始值来调用
        */
        let str = new String("hello")
        let num = new Number(11)
        let bool = new Boolean(true)
        let bool2 = new Boolean(true)
        alert(bool == bool2)
        str = "helloworld"
        str.name = "哈哈"
        

    </script>
</head>

<body>

</body>

</html>
