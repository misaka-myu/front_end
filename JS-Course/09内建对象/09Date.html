            Date
                -在js中所有的和时间相关的数据都由Date对象表示

                    getFullYear() 获取4位年份

                    getDate() 返回当前是几日
                    getDay() 返回当前日期是周几 (0~6) 0表示周日
                    ...
                    getTime() 返回当前日志对象的时间戳
                        时间戳:自 1970年1月1日0时0分0秒到当前时间所经历的毫秒数
                        计算机底层存储时间时使用的都是时间戳
                    Date.now() 获取当前的时间戳
        */
