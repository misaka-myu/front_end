    <title>参数</title>
    <script>
        /* 
            在定义函数时,可以指定数量不等的参数
            在函数中定义参数就像等于在函数内部声明了对应的变量,但是没有赋值
            实际参数
            在调用函数时,可以在函数的()中传递数量不等的实参
            如果实参多于形参那么多于的实参不会使用
            如果形参多于实参,那么多余的形参是undefined
            - 参数的类型
            js中不会检查我们参数的类型,可以传递任何类型的值作为参数
        
        
        */
    </script>
