<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数</title>
    <script>
        // 函数也是一个对象
        /* 
            它具有其他所有对象所有的功能
            并且函数中可以存储代码,并且可以在需要的时候调用这些代码
            调用函数
            调用函数就是执行函数中所存储的代码
            语法:
                函数对象+()
        */
    //    创建一个函数对象
    function fn(){
        console.log('你好');
        console.log('萨瓦迪卡');       
    }
    console.log(fn)
    fn()
    </script>
</head>
<body>
    
</body>
</html>
