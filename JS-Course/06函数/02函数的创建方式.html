<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数的创建方式</title>
    <script>
        /* 
            函数的定义方式:
                1.函数声明
                    function函数名([参数]){
                        语句...
                    }
                2.函数表达式
                const 变量 = function(){
                }
                3.箭头函数
                () => {
                    语句... 
                }
        
        */
        function fn (){
            console.log('函数声明所定义的函数');

        }
        const fn2 = function (){
            console.log('函数表达式');

        }
        //匿名函数
        
        const fn3 = () =>{
            console.log('箭头函数');
            
        }
        const fn4 = () => console.log(''); //只有一行语句是可以省略不写的

    </script>
</head>

<body>

</body>

</html>
