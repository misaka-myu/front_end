<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象作为参数</title>
    <script>
        function fn(a){
            console.log(a);
            
        }
        // 对象可以作为参数传递
        // 传递实参的时候传递的不是变量本身,而是变量中存储的值
        // 修改变量的时候,只会影响当前的变量
        let obj = {name:'保尔'}
        fn(obj) 
        // 函数每次调用都会重新创建默认值
        


    </script>
</head>
<body>
    
</body>
</html>
