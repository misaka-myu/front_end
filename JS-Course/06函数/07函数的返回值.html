            在函数中可以通过return关键字来指定函数的返回值
            返回值就是调用函数时的执行结果
            任何值都可以作为函数的返回值使用,包括对象和函数
            如果直接写一个return后面不跟任何值的话,相当于返回一个undefined
            如果不写return,函数的返回值依然是undefined
