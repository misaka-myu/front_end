<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭头函数的返回值</title>
    <script>
        const sum = (a,b) => {
            return a + b
        }
        let result = sum(1,2)
        console.log(result);
        // 箭头函数的返回值可以直接写在箭头后面
        // 这种情况下使用于函数体比较小的情况
        // 如果在箭头后设置对象字面量为返回值,对象字面量必须使用()括起来,不然的话就会把对象字面量识别成为代码块
        const sum2 = (a,b) => a + b
        const fn = (a,b) => ({name:'小明'})
    </script>
</head>

</html>
