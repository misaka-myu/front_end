<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭头函数的参数</title>
    <script>
        /* 
        
            定义参数时,可以为参数指定一个默认值
        
        
        */
        const fn = (a) => {
            console.log('a=',a);
            
        }
        fn(123)
        // 当箭头函数只有一个参数的时候括号可以省略
        const fn2 = a => {
            console.log('a=',a);
            
        }
        const fn3 = (a = 11,b = 22,c = 33) => {
            console.log('a=',a);
            console.log('b=',b);
            console.log('c=',c);
            
        }

        fn2(111)
    </script>
</head>
<body>
    
</body>
</html>
