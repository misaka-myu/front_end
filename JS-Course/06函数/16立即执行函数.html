<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立即执行函数</title>
    <script>
        /* 
            在开发中应尽量减少在全局作用域中编写代码
            所以我们的代码要尽量编写到局部作用域
            如果使用let声明的变量,可以使用{}创建块作用域
            立即执行函数
            IIFE
            立即执行函数是一个匿名的函数,并且只会执行一次
            可以使用IIFE来创建一个一次性的函数作用域,避免变量冲突问题
        
        */
        (function () {
            let a = 10
            console.log(a);
        }())
    </script>
</head>

<body>

</body>

</html>
