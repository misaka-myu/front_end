<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>严格模式</title>
    <script>
        'use strict' //全局的严格模式   
        let a = 10
        /* 
            js中运行代码的模式有两种
                正常模式
                    默认情况下代码都运行在正常模式下
                        在正常模式中,语法检查并不严格
                        他的原则是:能不报错就不报错
                        这种模式导致代码的性能较差
                严格模式
                    在严格模式下,语法检查变得严格
                        1.禁止一些语法
                        2.更容易报错
                        3.提升了性能
                开发中应尽量使用严格模式
                这样可以将一些隐藏的问题消灭在萌芽阶段,
                同时也能提升代码的运行性能 

        */
    </script>
</head>
<body>
</body>
</html>
