<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作用域链</title>
    <script>
        /* 
            当我们使用一个变量时
            js解释器会优先在当前作用域寻找变量
                如果找到了则直接使用,
                如果没有找到则去上一级作用域中去寻找,找到了则使用,
                如果没找到继续去上一级作用域中去寻找,
                如果一直到全局作用域都没找到,则报错,xxx is not defined
        
        */
    </script>
</head>
