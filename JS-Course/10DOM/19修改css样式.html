<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改css样式</title>
    <style>
        .box1 {
            width: 200px;
            height: 200px;
            background-color: #bfa;
            /* 获得最高的优先级,优先级超过内联样式 */

        }

        .box2 {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <button id="btn">点我一下</button>
    <hr>
    <div class="box1"></div>
    <script>
        /* 
            点击按钮后修改box1的宽度
        
        */
        //    获取按钮
        const btn = document.getElementById("btn");
        const box1 = document.querySelector(".box1");
        btn.onclick = function () {
            //修改box1的样式
            // 修改样式的方式: 元素.style.样式名 = 样式值 
            // 如果样式名中含有-,则需要将样式表修改为驼峰命名法
            // box1.style.width = "600px";
            // box1.style.backgroundColor = "green";
            // 除了直接修改样式外,也可以通过修改class属性来间接的修改样式
            // box1.className += " box2"; 不建议使用className来进行操作
            /* 
                通过class修改样式的好处
                    1.可以一次性修改多个样式
                    2.对JS和CSS进行一个解耦

            
            */
            //元素.classList是一个对象,对象中提供了对当前元素的类的各种操作方法
            /* 
                元素.classList.add() 像元素中添加一个或多个class
                元素.classList.remove() 移除元素中的一个或多个class
                元素.classList.toggle() 切换元素中的一个class
                元素.classList.replace()替换class
            */
            box1.classList.add("box2");
            box1.classList.remove("box1");
            let result = box1.classList.contains("box1");
            console.log(result);
            

        }
    </script>
</body>

</html>
