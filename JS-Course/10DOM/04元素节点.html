<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素节点</title>
    
</head>
<body>
    <div id="box1">
        我是box1
        <span class="s1">我是s1</span>
        <span class="s1"></span>
    </div>
    <span class="s1">我是s1</span>
    <script>
        /* 
                div元素的原型链
                    HTMLDivElement ->HTMLElement -> Element -> Node ->...
                通过元素节点对象获取其他节点的方法
                    element.childNodes 获取当前元素的子节点(会包含空白的子节点)
                    element.children 获取当前元素的子元素
                    element.firstElementChild 获取当前元素的第一个子元素
                    element.lastElementChild 获取当前元素的最后一个子元素
                    element.nextElementSibling获取当前元素的下一个兄弟元素
                    element.previousElementSibling 获取当前元素的前一个兄弟元素
                    element.parentNode 获取当前元素的父节点
                    element.tagName 获取当前元素的标签名 div span p 
        */
        const box1 = document.getElementById("box1")
        const spans = box1.getElementsByTagName("span")
        console.log(spans.leng);
        const cns = box1.childNodes
        console.log("cns -->",cns);
        

        
        console.log(box1);
        
    </script>
</body>
</html>
