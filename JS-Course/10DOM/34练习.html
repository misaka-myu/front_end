<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习</title>
    <style>
        .outer {
            width: 640px;
            margin: 50px auto;
            text-align: center;
        }

        .img-wrapper img {
            width: 640px;
            height: 390px;
        }
    </style>
</head>

<body>
    <div class="outer">
        <p id="info">总共n张图片,当前是第m张</p>
        <div class="img-wrapper">
            <img src="./img/1.jpg" alt="">

        </div>
        <div class="btn-wrapper">
            <button id="prev">上一张</button>
            <button id="auto">自动 </button>
            <button id="next">下一张</button>
        </div>
    </div>
    <script>
        // 点击按钮切换图片
        // 首先获取到图片
        const img = document.getElementsByTagName("img")[0];
        const prev = document.getElementById("prev");
        const next = document.getElementById("next");
        const info = document.getElementById("info");
        const auto = document.getElementById("auto");
        // 点击next按钮切换图片
        // 创建一个数组存储路径
        const imgArr = [
            "./img/1.jpg",
            "./img/2.jpg",
            "./img/3.jpg",
            "./img/4.jpg",
        ];
        // 创建一个变量记录当前图片的索引
        let current = 0;
        /* 
            添加一个图片自动切换的功能

        */
        info.textContent = `总共${imgArr.length}张图片,当前第${current + 1}张`
        prev.onclick = function () {
            clearTimeout(timer);
            current--;
            if (current < 0) {
                current = imgArr.length - 1;
            }

            img.src = imgArr[current];
            info.textContent = `总共${imgArr.length}张图片,当前第${current + 1}张`
        }
        next.onclick = function () {
            clearTimeout(timer);
            //切换图片 -->2.png 就是修改img的src属性
            current++;
            if (current > imgArr.length - 1) {
                current = 0;
            }

            img.src = imgArr[current];
            info.textContent = `总共${imgArr.length}张图片,当前第${current + 1}张`
        }
        // 创建一个变量来存储计时器的id
        let timer
        auto.onclick = () => {
            // alert(123);
            // 开启定时器来自动添加图片
            
            timer = setTimeout(function auto() {
                // 修改索引
                
                current++;
                if (current > imgArr.length - 1) {
                    current = 0;
                }

                img.src = imgArr[current];
                info.textContent = `总共${imgArr.length}张图片,当前第${current + 1}张`
                timer = setTimeout(auto,3000);
            }, 3000)
        }

    </script>
</body>

</html>
