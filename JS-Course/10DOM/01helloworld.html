<!DOCTYPE html>
<html lang="zh-CN">

    <title>helloworld</title>

    </script>
</head>
<body>
    <button id="btn">点我一下</button>
    <script>
        /* 
            要使用DOM操作网页,我们需要浏览器至少得先给我一个对象
                才能去完成各种操作 
            所以浏览器已经为我们提供了一个document对象,他是一个全局变量,我们可以直接使用
                document代表的是整个网页

        */
       document.write("helloworld");
        //获取btn对象
        const btn = document.getElementById("btn");
        console.log(btn);
        // 修改btn中的文字
        btn.innerText = "Click Me";
        
        </script>
</body>
</html>
