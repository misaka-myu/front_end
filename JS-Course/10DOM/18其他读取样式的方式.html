<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>其他读取样式的方式</title>
    <style>
        #box1{
            width: 200px;   
            height: 200px;
            padding: 50px;
            margin: 50px;
            border: 10px red solid;
            background-color: #bfa;
            overflow: auto;
        }
        #box2 {
            width: 100px;
            height: 500px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <button id="btn">点我一下</button>
    <hr>
    <div id="box1">
        <div id="box2">
            
        </div>
    </div>




    <script>
        const btn = document.getElementById("btn");
        const box1 = document.getElementById("box1");
        btn.onclick = function(){
            /* 
                元素.clienthight
                元素.clientwidth
                获取元素内部的宽度和高度(包括内容区和内边距)
                元素.offsetHeight 
                元素.offsetWidth
                    -获取元素可见框的大小(包括内容区,内边距和边框)
                元素.scrollHeight
                元素.scrollWidth
                    -获取元素滚动区域的大小
                元素.offsetTop
                元素.offsetLeft
                    -获取元素相对于其父元素的偏移量
                元素.offsetParent
                    -获取元素的定位父元素
                    -定位父元素:离当前元素最近的开启了定位的祖先元素,如果所有的元素都没有开启定位则返回body
                元素.scrollTop
                元素.scrollLeft
                    -获取或设置元素滚动条的偏移量
                    -注意这个值既可以设置又可以查看
                以上这些值都没有单位,拿过来就可以直接计算
            */  
           console.log(box1.clientWidth);
           console.log(box1.clientHeight);
           console.log(box1.offsetHeight);
           console.log(box1.offsetWidth);
           console.log(box1.offsetParent);
           console.log(box1.scrollTop);
           
           
        }
    </script>
</body>
</html>
