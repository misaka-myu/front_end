<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件循环</title>
</head>

<body>

    <button id="btn">点我一下</button>
    <script>
        /* 
            事件循环(event loop)
                -函数在每次执行时都会产生一个执行环境
                -执行环境负责存储函数在执行时产生的一切数据
                -问题:函数的执行环境要存储到哪里?
                    -函数的执行环境存储到了一个叫做调用栈的地方
                    -栈是一种数据结构,特点后进先出
                    -队列,是一种数据结构,特点:先进先出
                调用栈(call stack)
                    -调用栈负责存储函数的执行环境
                    -当一个函数被调用时,他的执行环境会作为栈帧
                        插入到调用栈的栈顶,函数执行完毕其栈帧会自动从栈中弹出
                消息队列
                    -消息队列存储将要执行的函数
                    -当我们触发一个事件时,其相应函数并不是直接就添加到调用栈中的
                        因为调用栈中有可能会存在一些没有执行完的代码
                    -事件触发后,js引擎是将事件相应函数插入到消息队列排队
                        
        */
        const btn = document.getElementById("btn");
        btn.onclick = function () {
            console.log('按钮被点击了');
            
        }
        function fn() {
            let a = 10;
            let b = 20;
            console.log("fn~~~");
            function fn2() {
                console.log("fn2");

            }
            fn2()
        }
        fn();
    </script>
</body>

</html>
