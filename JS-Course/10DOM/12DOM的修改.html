<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>DOM的修改</title>

</head>

<body>
    <button id="btn01">按钮1</button>
    <button id="btn02">按钮2</button>

    <hr>
    <ul id="list">
        <li id="swk">孙悟空</li>
        <li id="zbj">猪八戒</li>
        <li id="shs">沙和尚</li>
    </ul>
    <script>
        /* 
           点击按钮后向ul中添加一个唐僧
        
        */
        // 获取按钮
        const btn01 = document.getElementById("btn01");
        btn01.onclick = function () {
            // 创建一个li
            const li = document.createElement("li");
            // 向li中添加文本
            li.textContent = "唐僧";
            // 给li添加id属性
            li.id = "ts";
            // appendChild()用于给一个节点添加一个子节点
            // list.appendChild(li);
            // insertAdjacentElement()可以向元素的任意位置添加元素
            // 两个参数:1.要添加的位置2.要添加的元素
            // beforeend 标签的最后 afterbegin 标签的开始 beforebegin 开始标签之前 beforeend结束标签之前
            list.insertAdjacentElement("beforeend", li);
            list.insertAdjacentHTML("beforeend", "<li id='bgj'>白骨精</li>")
        }
        // 获取元素btn02
        const btn02 = document.getElementById("btn02");
        btn02.onclick = function () {
            // 创建一个蜘蛛精替换孙悟空
            const li = document.createElement("li");
            li.textContent = "蜘蛛精";
            li.id = "zzj";
            const swk = document.getElementById("swk");
            // replaceWith(li)使用一个元素替换当前元素
            swk.replaceWith(li);
            // remove方法用来删除当前元素
            swk.remove(); 
        }   
    </script>
</body>

</html>
