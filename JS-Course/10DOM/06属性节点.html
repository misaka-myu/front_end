<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>属性节点</title>
    
    
</head>
<body>
    <input type="text" name="username" value="admin" disabled>
        <script>
            /* 
                属性节点(Attr)
                    -在DOM中也是一个对象,通常不需要获取对象而是直接通过元素即可完成对其的各种操作
                    -如何操作属性节点:
                        方式一:
                            读取: 元素.属性名(class属性需要使用className来读取) 
                                读取一个布尔值的时候会返回true或false(比如disabled)
                            修改: 元素.属性名 = 属性值
                        方式二:
                            读取: 元素.getAttribute(属性名) 这里在读取的时候class不需要进行任何的修改
                            修改: 元素.setAttribute(属性名,属性值)
                            删除:元素.removeAttribute(属性名)

            */
                const input = document.querySelector("[name = username]")
                console.log(input.type);
                
         </script>
</body>
</html>
