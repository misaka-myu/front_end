<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .img-list li {
            position: absolute;
            opacity: 0;
            transition: opacity .3s;
        }

        .img-list a img {
            width: 390px;
            height: 400px;
            vertical-align: top;
        }

        .outer {
            width: 390px;
            height: 400px;
            margin: 100px auto;
            position: relative;
        }

        li.current {
            z-index: 1;
            opacity: 1;
        }

        /* 
            设置两个箭头的样式
        
        */
        .prev-next a {
            font-size: 40px;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            position: absolute;
            top: 0;
            bottom: 0;
            margin: auto;
            z-index: 2;
            height: 60px;
            opacity: .5;
        }

        .prev-next a:hover {
            opacity: 1;
        }

        #next {
            right: 0;
        }
    </style>
</head>

<body>
    <div class="outer">
        <ul class="img-list">
            <li class="current">
                <a href="#">
                    <img src="./img/1.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/2.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/3.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="./img/4.jpg" alt="">
                </a>
            </li>

        </ul>
        <!-- 
            添加切换按钮

        
        -->
        <div class="prev-next">
            <a id="prev" href="javascript:;">
                < </a>
                    <a id="next" href="javascript:;">></a>
        </div>
    </div>
    <script>
        /* 
            自动切换图片
        
        */
        //获取outer 
        const outer = document.getElementsByClassName("outer")[0];
        outer.onmouseenter = () => {
            toggleChange();
        }
        outer.onmouseleave = () => {
            toggleChange();
        }
        const toggleChange = (function () {
            let timer = null;
            return  () => {
                if (timer === null) {
                    timer = setTimeout(function auto() {
                        changeImg("next");
                        timer = setTimeout(auto, 3000);
                    }, 3000);

                } else {
                    clearTimeout(timer);
                    timer = null;
                }

            }
        })();

        toggleChange();
        const prev = document.getElementById("prev");
        const next = document.getElementById("next");
        prev.onclick = () => {


            const current = document.querySelector(".img-list .current");
            changeImg("prev");
            // 获取下一个图片

        }
        next.onclick = () => {

            //获取当前显示的图片
            changeImg("next");
        }
        /* 
                changImg用来切换图片
                    参数:
                        dir 切换图片的方向
                            next
                            prev
                        
        
        */
        function changeImg(dir) {
            //获取当前显示的图片
            const current = document.querySelector(".img-list .current");
            let next;
            if (dir === "next") {

                // 获取下一个图片
                next = current.nextElementSibling || document.getElementsByTagName("li")[0];
                // 切换显示状态
                current.classList.remove("current");
                next.classList.add("current");
            } else if (dir === "prev") {

                const next = current.previousElementSibling || document.querySelector("li:last-child");
                // 切换显示状态
                current.classList.remove("current");
                next.classList.add("current");


            }

        }
    </script>
</body>

</html>
