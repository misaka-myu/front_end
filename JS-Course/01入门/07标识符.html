<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标识符</title>
    <script>
        // 在js中,所有可以由我们自主命名的内容,都可以认为是一个标识符
        /* 
            变量名,函数名,类名
            使用标识符时需要遵循一定的命名规范
            1.表示符只能含有字母数字下划线,$,且不能以数字开头\
            标识符不能是js中的关键字或保留字,也不建议使用内置的函数名或类名
            命名规范:通常会使用驼峰命名法,第一个单词小写,后面的单词首字母大写
            类名大驼峰命名法
            常量的字母会全部大写

        */
    </script>
</head>
