<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04字面量和变量</title>
    <script>
        // 字面量其实就是一个值,他所代表的含义就是字面的意思
        // 变量可以用来存储字面量
        // 并且变量中存储的字面量可以随意修改
        let x
        x = 80
        console.log(x)
        // 声明变量 let + 变量名 变量复制直接用等号
        // 声明变量也可以使用var
        var a
        // 声明和赋值同时进行
        var b = 10
    </script>
</head>
<body>
    
</body>
</html>
