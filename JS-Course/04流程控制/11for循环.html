<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for循环</title>
    <script>
        /* 
            本质上是一样的,不同点是不同的语法结构
            for循环更加清晰一些
            for(初始化表达式;条件表达式;更新表达式){
                语句
            }
        
        */
        /* 
            for循环执行流程,先执行初始化表达式,初始化变量
            执行条件表达式,判断循环是否执行(true 执行,false终止)
            判断结果为true则执行循环体
            执行更新表达式,对初始化变量进行修改 
            重复第二步骤,直到判断为false为止
            初始化表达式在循环的整个生命周期中只会执行一次
            for循环中的三个表达式都可以不写
            如果三个表达式都不写的话就是一个死循环
            使用let在for循环中生命的变量是局部变量,只能在for循环内部进行访问
            使用var
            创建死循环的方式
            while(1){}
            for(;;){}
        
        */
        for (let i = 0; i < 5; i++) {
            console.log(i);

        }
    </script>
</head>

<body>

</body>

</html>
