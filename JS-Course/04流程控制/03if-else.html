<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if-else</title>
    <script>
        /* 
            if-else 语法
                if(条件表达式){
                }else {
                }
            执行流程:
                if-else执行时,先对条件表达式进行求值判断,
                如果结果为true则执行if后的语句
                如果结果为false则执行else中的语句
                if-else if-else 语句
                语法:
                    if(条件表达式){
                    }else if(条件表达式){
                    }else if(条件表达式){
                    }else if(条件表达式){
                    }
                if-else if-else,会自上向下依次对if后的表达式进行求值判断
                如果条件表示式结果为true,则执行if后的语句,执行完毕语句结束
                如果条件表示式结果为false,继续向下判断,知道找到true为止
                如果所有的条件表达式都是false,则执行else后的语句
                if-else if-else代码块中只会有一个代码块被执行
                prompt函数可以用来获取用户输入的内容,它会将用户输入的内容以字符串的形式返回,可以通过变量来接受
        
        */
    </script>
