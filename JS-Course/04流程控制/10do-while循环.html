    <title>do_while循环</title>
    <script>
        /* 
            do-while() 语法
            do{
            }while(条件表达式)
            执行顺序
            do-while执行时,会先执行do后的循环体,
            执行完毕后,会对while后的条件表达式进行判断
            如果为false,则循环终止
            如果为true则继续执行循环体,以此类推
            while语句是先判断再执行,do-while语句是先执行在判断
            do-while可以确保循环至少执行一次,如果循环次数超过1次的话没有影响
        */


    </script>
