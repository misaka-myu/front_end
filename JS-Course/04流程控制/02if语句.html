<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if语句</title>
    <script>
        /* 
            流程控制语句可以用来改变程序执行的顺序
            条件判断语句
            条件分支语句
            循环语句
            if语句只会控制紧随其后的那一行代码
            如果希望可以控制多行代码,可以使用{}将语句括起来
            即使if后只有一行代码也应该编写代码块这样代码的结构会更加的清洗
            如果if后的条件表达式不是布尔值,会转换成布尔值再进行运算
        */
        if(true)
            alert('哈哈哈')
    </script>
</head>
<body>
    
</body>
</html>
