<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch语句</title>
    <script>
        /*
            switch表达式语法
            switch(表达式):{
            case 表达式1:
                    代码...
                case 表达式2:
                    代码...
                case 表达式3:
                    代码...
                case 表达式4:
                    代码...
            }
            switch语句执行时,会依次将switch后的表达式和case后的表达式进行全等比较
            如果比较结果为true,则自当前case出开始执行代码
            如果比较结果为false,则继续比较其他case后的表达式,直到找到true为止
            这里的全等比较也就是===
            当比较结果是true时,会从当前case处开始执行代码
                也就是说case是代码执行的起始位置
                这就意味着只要是当前case后的代码,都会执行
                可以在每一个case后面以break结尾
                可以使用break来避免执行其他的case
                break可以用来结束switch语句
            如果所有的比较都是false,则执行default后面的语句 
            default的书写位置不太影响,default都是最后执行
            switch和if的功能是重复的,switch能做的,if也能做,反之亦然\
            他们最大的不同是,switch有多个全等判断时候结构比较清晰
        
        
        */
       let num = +prompt('请输入一个数字')
       switch(num){
            case 1: 
                alert('壹')
                break
            case 2:
                alert('贰')
                break
            case 3:
                alert('叁')
                break
            default:
                alert('我是default')
       }

    </script>
</head>

<body>

</body>

</html>
