<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while的练习</title>
    <script>
        /* 
            假设银行存款的年利率是5%,1000块存多少年可以变成5000块
        
        */
        let money = 1000
        let year = 0
        while (money < 5000) {
            money *= 1.05
            year++
        }
        console.log(year);
        


    </script>
</head>
