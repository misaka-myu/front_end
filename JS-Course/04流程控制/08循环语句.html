<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循环语句</title>
    <script>
        /* 
            js中一共有三种循环语句
            while
            for
            do while
            while语句
            while(条件表达式){
            }
            while语句执行时会先对条件表达式进行判断
                如果结果为true,则执行循环体,执行完毕,继续判断
                如果为true则再次执行循环体,执行完毕,继续判断,如此重复
                直到条件表达式结果为false时,循环结束
            通常写一个循环需要有三个表达式
            1.初始化表达式(初始化变量)
            2.条件表达式(设置循环运行的条件)
            3.更新表达式(修改初始化的变量)

        */
        let a = 0
        while(a < 3){
            console.log(a);
            a++
        }
    </script>
</head>
<body>
    
</body>
</html>
