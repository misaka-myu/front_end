<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算数运算符</title>
    <script>
        // 运算符可以用来对一个或多个操作数进行运算
        /* 
            + - * / **(幂运算)
            js是一门弱类型语言,当我们进行运算时,会通过自动的类型转换完成运算
            算术运算时,除了字符串的加法
            其他运算的操作数是非数值时,都会转换为数值然后在运算 
        */
        let a;
        a = 10 - '5'
        console.log(a);
        a = 6 - undefined
        console.log(a); 
        // undefined转换为数字是null
        // 所以说上述结果也是null
        a = 1 + '2'
        // 当任意一个值和字符串做加法运算时,他会先将其他值转换为字符串,然后再做拼串的操作
        // 可以通过任意类型+空串的形式来将其转换为字符串,其原理和String()函数想同,但使用起来更加简洁
    </script>
</head>
<body>
    
</body>
</html>
