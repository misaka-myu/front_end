    <title>自增和自减</title>
    <script>
        // ++使用后会使原来变量的值发生变化
        // ++分为前自增和后自增
        // 无论是前自增还是后自增都会使原变量增加1
        // 不同的是a++和++a返回的结果是不同的
        /* 
            - a++是自增前的值
            - ++a是自增后的值
            - 自减也是同理的

        */
    </script>
