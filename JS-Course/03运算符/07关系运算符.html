<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关系运算符</title>
    <script>
      /* 
            关系运算符用来检查两个值之间的关系是否成立
            成立返回true,不成立返回false
            >用来检查左值是否大于右值
            如果关系成立返回true,如果关系不成立返回false
            当对非数值进行关系运算时,它会先将其转换为数值,,然后再比较
            当关系运算符的两端是两个字符串的时候,他不会将字符串转换为数字它会逐位的比较字符的Unicode编码
            利用这个特点可以对字符串按照字面排序
            比较字符串格式的数字时一定要进行类型转换
            可以在字符串的前面加上一个+号
            < 
            >=
            <=
        
        */
      let result = 5 < "10"; //true
      result = "1" > false; //true
      console.log(result);
      result = "a" < "b"; //true
      //检查num是否在5和10之间
      let num = 6
      result = 5 < result < 10 //错误的写法
      result = num > 5 && num < 10
    </script>
  </head>
  <body></body>
</html>
