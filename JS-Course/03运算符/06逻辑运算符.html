<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逻辑运算符</title>
    <script>
        /* 
           这两个运算符都是二元运算符
            && 逻辑与
            可以对两个值进行与运算
            当&&左右都为true时,则返回true,否则返回false
            与运算是短路的与,如果第一个值为false,则不看第二个值
            与运算是找false的,如果找到false直接返回,如果没有找到false,则返回true
            对于非布尔值进行与运算时,他会转换为布尔值,然后运算,最终转换为原值
            如果第一个值为false,则直接返回第一个值
            || 逻辑或
            可以对两个值进行或运算
            当||左右有true时返回
            或运算也是短路的或,如果第一个值为true,则不看第二个值
            或运算是找true的,如果找到true则直接返回,没有true才会返回false
            对于非布尔值运算,则会先转换为布尔值,最后返回原值
        */
    </script>
</head>

</body>
</html>
