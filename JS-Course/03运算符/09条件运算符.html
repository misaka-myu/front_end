<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>条件运算符</title>
    <script>
        /* 
            条件运算符
            条件表达式?表达式1:表达式2
            条件运算符在表达时,会先对条件表达式进行求值判断
            如果结果为true则执行表达式1,如果条件为false,则执行表达式2

        
        
        */
       true ? alert(1) : alert(2)
    </script>
</head>
<body>
    
</body>
</html>
