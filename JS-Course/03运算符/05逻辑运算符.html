<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逻辑运算符</title>
    <script>
        /* 
            !逻辑非 可以对一个布尔值进行取反操作,如果对一个非布尔值取反会先将其转换为布尔值,然后再取反
            可以对任意值以取两次反的形式将其转换为布尔值
            && 逻辑与
            || 逻辑或
            类型转换:
                - 转换为字符串
                    -显式转换 
                    String()
                    -隐式转换
                    +""
                - 转换为数值
                    -显式转换
                    Number()
                    -隐式转换
                        +
                - 转换为布尔值
                    -显式转换
                        Boolean()
                    -隐式转换
                        !!
        */
    </script>
