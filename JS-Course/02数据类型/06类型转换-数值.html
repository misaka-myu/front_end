        // 1.使用Number函数将其他类型转换为数值
        /* 
            如果字符串是一个合法的数字,则会自动转换为对应的数字
            如果字符串不是一个合法的数字,则转换成NaN
            如果字符串是空串或者是纯空格的字符串,则转换为0
            布尔值true转换为1,false转换为0
            null转换为0
            undefined转换为Nan
            专门用来将字符串转换为数值的两种方法
            parseInt()将一个字符串转换为一个整数
            解析时会自左向右解析一个字符串，直到读取到字符串中所有有效的整数
            parseFloat()将一个字符串转换为浮点数
            可以使用parseInt()对浮点数进行一个取整
        */
