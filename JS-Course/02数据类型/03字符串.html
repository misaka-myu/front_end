<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符串</title>
    <script>
        // 字符串
        /* 
            在js中使用单引号或者双引号创建一个字符串
            转义字符 \" 双引号
            \\ 得到一个反斜杠
            模版字符串` 可以换行,双引号引起来的字符串不可以直接换行,可以加一个\,取消转义
            模版字符串中可以嵌入变量
        */
        let a = 'hello'
        console.log(a)
        let name = '孙悟空'
        let str = `你好,${name}`
        console.log(str)
    </script>
</head>
<body>
    
</body>
</html>
