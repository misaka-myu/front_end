<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类型检查</title>
    <script>
        // typeof 运算符,用来检查变量的类型
        // typeof 用来检查不同值的类型
        // js变量是没有类型的,typeof检查的是变量里面存的值的类型
        let a = 10
        let b = 10n
        console.log(typeof a)
        console.log(typeof b)
    </script>
</head>
