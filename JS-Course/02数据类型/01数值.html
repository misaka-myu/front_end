    <title>数值</title>
    <script>
        /* 
            数值
                -在js中所有的整数和浮点数都是number类型
                - js中的数值并不是无限大的,当数值超过一定的范围后会显示近似值
                Infinity表示无穷
                在js中进行一些精度比较高的值的计算时需要注意
                小数计算的时候可能是不精确的
                NaN表示not a number 表示这个数字是不合法的
                大整数(BigInt)
                表示比较大的整数,一个数字以n结尾就表示使用大整数,它可以表示的数字范围是无限大
                其他进制的数字
                二进制以0b开头
                八进制以0o开头
                十六进制以0x开头
       */
