    <title>多态</title>
    <script>
        /* 
            多态
                -在js中不会检查参数的类型,所以就意味着任何数据都可以作为参数传递
                -要调用某个函数,无需指定的类型,只要对象满足某个条件既可
                -如果一个东西走路像鸭子,叫起来像鸭子,那么它就是鸭子
                -多态为我们提供了灵活性
        */
    </script>
