<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承</title>
    <script>
        /* 
            继承
                -可以通过extends关键字来完成继承
                -当一个类继承另一个类时,就相当于将另一个类中的代码复制到了当前类
                -继承发生时,被继承的类称为父类(超类),继承的类称为子类
                -通过继承可以减少重复的代码,并且可以在不修改一个类的前提对其进行扩展
            封装 提供了安全性
            继承 提供了扩展性
            多态 提供了灵活性
            通过继承可以在不修改一个类的情况下对其进行扩展
            - OCP开闭原则
                -程序应该对修改关闭,对扩展开放
        */
       class Animal{
            constructor(name){
                this.name = name
            }
            sayHello(){
                console.log('动物在叫');
                
            }
       }
       class Dog extends Animal{
            // 在子类中,可以通过创建同名方法来重写父类的方法
            sayHello(){
                console.log('汪汪汪');
                
            }
            // 重写
       }
       class Cat extends Animal{
            constructor(name){
                super(name) //调用父类的构造函数 
            }
            // 重写构造函数的时候代码的第一行必须写super()
            sayHello(){
                super.sayHello() //在方法中可以使用super来引用父类的方法
                console.log('喵喵喵');
                
            }
       }
       const dog = new Dog()
       const cat = new Cat()
       cat.sayHello()
    </script>
</head>
<body>
    
</body>
</html>
