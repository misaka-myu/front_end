<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>属性</title>
    <script>
        /* 
            类是创建对象的模版,要创建对象的第一件事就是定义类
            类的代码块默认就是严格模式
            类的代码是用来设置对象的属性的
            可以用来定义定义类中的属性
        */
        class Person {
            name
            age
            // 静态属性
            static test = "静态属性" //使用static声明的属性是静态属性(类属性)
            // 静态属性只能通过类对象来访问

        }

    </script>
</head>

<body>

</body>

</html>
