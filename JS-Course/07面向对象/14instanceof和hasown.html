<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instanceof和hasown</title>
    <script>
        class Animal{
                constructor(name){
                    this.name = name
                }
                sayHello(){
                    console.log('hello');
                    
                }
        }
        class Dog extends Animal {

        }
        /* 
            instanceof用来检查一个对象是否是一个类的实例
                -instanceof检查的是对象的原型链上是否有该类实例
                    只要原型链上有该类实例,就会返回true
                    Object是所有对象的原型,所以任何对象和Object进行instanceof运算都会返回true
                    可以通过实例.__proto__或者是通过类的prototype来访问原型
            in运算符,用来检查某个对象中是否含有某个属性
        
        */  
        const dog = new Dog()
        console.log(dog instanceof Dog);
        console.log(dog instanceof Animal);
        /* 
            in
                -使用in运算符检查属性时,无论属性在对象自身还是在原型中,都会返回true 
            
        
        */
        console.log('sayHello' in dog);
        /* 
            对象.hasOwnProperty('属性名')
            用来检查一个对象的自身是否含有某个属性(现在不推荐使用)
        
        */
        console.log(dog.hasOwnProperty('name'));
        console.log(dog.hasOwnProperty('sayHello'));
        /* 
                Object.hasOwn(对象,属性名)
                    -用来检查一个对象的自身是否含有某个属性
        */
        Object.hasOwn(dog,'name')
    </script>
</head>
<body>
    
</body>
</html>
