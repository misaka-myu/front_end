<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原型对象</title>
    <script>
        class Person {
            name = '孙悟空'
            sayHello() {
                console.log('sayHello');

            }

        }
        const p = new Person()

        console.log(p.sayHello);
        console.log(p.__proto__);
        /* 
            访问一个对象的原型对象
            对象.__proto__
            原型对象中的数据:
                1.对象中的数据
                2.constructor(对象的构造函数)

            注意:原型对象也有原型,这样就构成了一条原型链,根据对象的复杂程度不同,原型链的长度也不同
            原型链:
                -读取对象属性时,会优先读取对象自身属性,如果对象中有则使用,没有则去原型中寻找,如果原型中有,则使用,没有则去原型的原型中寻找,直到找到Object
                对象的原型,Object对象的原型没有原型
        */
        //    可以检查某个对象的原型
        /* 
            作用域链是找变量的链,找不到会报错
            原型链是找属性的链,找不到会返回undefined
        
        */
        console.log(Object.getPrototypeOf(p))

    </script>
</head>

<body>

</body>

</html>
