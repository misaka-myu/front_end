<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序</title>
    <script>
        const arr = [9, 1, 3, 2, 8, 0, 5, 7, 6, 4]
        /* 
            冒泡排序  
            选择排序的思路,取出一个元素,然后将其他元素和该元素进行比较,如果其他元素比该元素小则交换两个元素的位置
        */
        for (let j = 0; j < arr.length - 1; j++) {
            for (let i = 0; i < arr.length - 1 - j; i++) {
                if (arr[i] > arr[i + 1]) {
                    // 大数在前,小数在后,需要交换位置
                    let temp = arr[i] //临时变量用于存储arr[i]的值
                    arr[i] = arr[i + 1]
                    arr[i + 1] = temp
                }
            }
        }

    </script>
</head>

<body>

</body>

</html>
