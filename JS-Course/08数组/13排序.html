<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序</title>
    <script>
        const arr = [9, 1, 3, 2, 8, 0, 5, 7, 6, 4];

        // 选择排序（减少不必要交换的优化写法）
        for (let i = 0; i < arr.length - 1; i++) {
            let minIndex = i; // 记录当前未排序区间的最小值索引
            for (let j = i + 1; j < arr.length; j++) {
                if (arr[j] < arr[minIndex]) {
                    minIndex = j;
                }
            }
            // 找到最小值后，仅在必要时交换一次
            if (minIndex !== i) {
                let temp = arr[i];
                arr[i] = arr[minIndex];
                arr[minIndex] = temp;
            }
        }

        // 正确打印：for...of 中的 item 即为当前元素
        for (let item of arr) {
            console.log(item);
        }
    </script>
</head>

</html>
