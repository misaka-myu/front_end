<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象的复制</title>
    <script>
        const arr = ['孙悟空','猪八戒','沙和尚']
        //如何去复制对象 复制必须要产生新的对象
        // 当调用slice时,会产生一个新的数组对象,从而完成对数组的复制
        const arr1 = arr.slice()
        console.log(arr1 === arr);
        

    </script>
</head>

</body>
</html>
