<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浅拷贝和深拷贝</title>
    <script>
        /* 
                浅拷贝(shallow copy)
                    -通常对对象的拷贝都是浅拷贝
                    -浅拷贝顾名思义,只对对象的浅层进行复制(只复制一层)
                    -如果对象中存储的数据是原始值,那么拷贝的深浅不重要
                    -浅拷贝只会对对象本身进行复制,不会复制对象中的属性或元素
                深拷贝(deep copy)
                    -深拷贝指不仅要复制对象本身,还复制对象中的属性和元素
                    -因为性能问题,通常情况下不太使用深拷贝
        
        
        */
       const arr = [{name:'孙悟空'},{name:'猪八戒'}]
       const arr2 = arr.slice()
       const arr3 = structuredClone(arr)//专门用来深拷贝的方法
    </script>
</head>

</body>
</html>
