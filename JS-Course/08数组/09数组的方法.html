<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组的方法</title>
    <script>
        /* 
            push()
                -向数组的末尾添加一个或多个元素,并返回新数组的长度
            pop()
                -删除并返回数组的最后一个元素
            unshift()
                -向数组的开头添加一个或多个元素,并返回新的长度
            shift()
                -删除并返回数组的第一个元素
            splice()
                -可以删除,添加,向数组中插入元素,替换元素
                -参数1,2,3
                    1.删除的起始位置
                    2.删除的数量
                    3.要插入的元素
                -返回值:
                    -返回被删除的元素
            reverse()
                -反转数组
        */
        const arr = ['孙悟空', '猪八戒', '沙和尚']
        arr.push('唐僧')
        console.log(arr);
        arr.push('白骨精', '红孩儿')
        arr.pop()
        arr.unshift('牛魔王')

        arr.shift()
        arr = ['孙悟空', '猪八戒', '沙和尚','唐僧']
        arr.splice(1,2,'牛魔王','铁扇公主','红孩儿')
        console.log(arr);
        arr = ['a','b','c','d']
        arr.reverse()
        /* 
            有如下一个数组
                arr = [1,2,1,3,2,4,5,5,6,7]
            编写代码,去除数组中重复的元素
        
        */


    </script>
