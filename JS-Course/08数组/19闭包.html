<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闭包</title>
    <script>
        /* 
                函数作用域,在函数创建时就已经确定了(词法作用域)
                    和调用的位置无关
            闭包利用的就是词法作用域
        
        */
        let a = "全局变量a"
        function fn() {
            console.log(a);

        }
        function fn2() {
            let a = '局部变量a'
            fn()
        }
        fn2()
        function fn3(){
            let a = 'fn3中的a'
            function fn4(){
                console.log(a);
                
            }
            return fn4
        }
        fn3()
        let fn4 = fn3()
        fn4()

    </script>
</head>

<body>

</body>

</html>
