    <title>练习</title>
    <script>
        /* 
            一对兔子出生后的两个月后每个月都能生一对小兔子
                -编写一个函数可以用来可以用来计算第n个月的兔子的数量
            
            规律:当前数等于前两个数之和,斐波那契数列
        */
        // 斐波那契数列
        function fib(month) {
            if (month === 1 || month === 2) {
                return 1
            }
            return fib(month - 1) + fib(month - 2)
        }
        console.log(fib(1));


    </script>
