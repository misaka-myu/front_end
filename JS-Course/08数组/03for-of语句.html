<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for-of语句</title>
    <script>
        /* 
            for-of语句可以用来遍历可迭代对象
            语法:
                for(变量 of 可以迭代的对象){
                    语句...
                }
            执行流程:
                for-of的循环体会执行多次,数组中有几个元素就会执行几次
                每次执行时都会把一个元素赋值给变量
        
        */
        const arr = [1, 2, 3, 4, 5, 6]
        for (let val of arr) {
            console.log(1);

        }
        // 字符串也是可迭代对象
        for(let value of 'hello'){
            console.log(value);
            
        }
    </script>
</head>

<body>

</body>

</html>
