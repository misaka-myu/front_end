<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可变参数</title>
    <script>
        /* 
            arguments
                -arguments是函数又一个隐含参数
                -arguments是一个类数组对象(伪数组)
                -arguments用来存储函数的实参
                    无论用户是否定义形参,实参都会存储到arguments对象中
                    可以通过该对象直接访问实参
        
        */
        function fn() {
            // 可以获得参数的数量
            console.log(arguments.length);
            // 可以通过下标索引来读取元素
            console.log(arguments[0]);

        }
        /* 
             定义一个函数可以求任意个值的和
        
        */
        function sum() {
            // 可以不受参数数量限制更加灵活的创建函数
            let result = 0
            for(let v of arguments){
                result += v
            }
            return result
      }
      /* 
            可变参数,在定义函数时可以将参数指定为可变参数
                -可变参数可以接受任意数量实参,并将他们统一存储到一个数组中返回
                -可变参数的作用和arguments基本是一致的,但是也具有一些不同点
                    1.可变参数的名字可以自己指定
                    2.可变参数就是一个数组,可以直接使用数组的方法
                    3.可变参数可以配合其他参数一起使用
      */
     function fn2(...args){

     }
     /* 
     
            当可变参数和普通参数一起使用时,需要将可变参数写到最后
            
     
     */
    function fn3(a,b,args){
        console.log(args);
        
    }
    
    
       
    </script>
</head>

<body>

</body>

</html>
