<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组的方法</title>
    <script>
        /* 
            indexOf()
                -获取元素在数组中第一次出现的索引
                -参数
                    1.要查询的元素
                    2.要查询的起始位置 
            lastIndexOf()
                -获取元素在数组中最后一次出现的位置
                -返回值:
                    找到了则返回元素的索引,
                    没有找到返回-1
            join()
                -将一个数组中的元素连接为字符串
                -参数:
                    指定一个字符串作为连接符
            slice()
                -用来截取数组(非破坏性方法)
                -截取的起始位置(包括该位置)
                -截取的结束为止(不包括该位置)
                    -第二个参数可以省略不写,如果省略则会一直截取到最后
                    -索引可以是负值
                如果将两个参数全都省略,则可以对数组进行浅拷贝(浅复制)

        
        */
       const arr = ['孙悟空','沙和尚','猪八戒','牛魔王']
       console.log(arr.indexOf('孙悟空'));
       
    </script>
</head>

</body>
</html>
