<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象</title>
    <script>
        /* 
            原始值:
            数值
            大整数
            字符串
            布尔值
            空值
            未定义
            符号
            对象相当于是一个容器,在对象中可以存储各种不同的数据类型

        
        
        */
    //    创建对象
        let obj = new Object()
        // 创建对象的时候可以把new省略
        // 对象中可以存储各种不同类型的数据,对象中存储的数据叫做属性
        // 向对象中添加属性 对象.属性名 = 属性值
        
        console.log(obj);
        obj.name = '孙悟空'
        obj.gender = '男'
        obj.age = 18
        console.log(obj.age);
        console.log(obj.gender);
        console.log(obj.name)
        // 修改属性和新增属性是一样的
        // 删除属性
        delete obj.name
        
    </script>
</head>
<body>
    
</body>
</html>
