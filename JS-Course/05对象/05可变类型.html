<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可变类型</title>
    <script>
        /* 
            原始值都属于不可变类型,一旦创建就无法修改
            对象属于可变类型
            对象创建完成后可以任意的删除和修改对象中的属性
            注意：
                如果有两个变量同时指向一个对象，
                    通过一个变量修改对象时，对另一个变量也会产生影响
                    当对两个对象进行相等或者全等比较的时候，比较的是两个对象的内存地址
        
        */
       let a  = 10
       a = 12
    </script>
</head>
<body>
    
</body>
</html>
