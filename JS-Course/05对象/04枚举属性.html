<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枚举属性</title>
    <script>
        /* 
            指将对象中的所有属性全部获取
            for-in语句
            for(let propName in 对象){
                语句
            }
            for-in的循环体会执行多次,有几个属性就会执行多少次,
            每次执行时,都会将一个属性名赋值给我们所定义的变量
        */
        let obj = {
            name: '孙悟空',
            age: '18',
            gender: "男"
        }
        for (let propName in obj) {
            console.log(propName,obj.[propName]);

        }



    </script>
</head>

<body>

</body>

</html>
