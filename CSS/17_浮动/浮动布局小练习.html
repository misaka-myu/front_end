<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动布局小练习</title>
    <style>
        /* 首先清楚默认样式 */
        * {
            margin: 0;
            padding: 0;
        }

        .lefefix {
            float: left;
        }

        .rightfix {
            float: left;
        }

        .clearfix::after {
            content: '';
            display: block;
            clear: both;
        }

        .containter {
            width: 960px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            width: 200px;

        }

        .banner1 {
            width: 540px;
            margin: 0 10px;

        }

        .banner2 {
            width: 200px;

        }

        .logo,
        .banner1,
        .banner2 {
            height: 80px;
            background-color: #ccc;
            line-height: 80px;
        }

        .menu {
            background-color: #ccc;
            height: 30px;
            margin-top: 10px;
            line-height: 30px;
        }
        .item1,.item2 {
            width: 368px;
            height: 198px;
            border: 1px solid black;
            margin-right: 10px;
            line-height: 198px;
        }
        .content {
            margin-top: 10px;
        }
        .item3,.item4,.item5,.item6 {
            width: 178px;
            height: 198px;
            border: 1px solid black;
            margin-right: 10px;
            line-height: 198px;
        }
        .bottom {
            margin-top: 10px;
        }
        .item7,.item8,.item9 {
            width: 198px;
            height: 128px;
            border: 1px solid black;
            line-height: 128px;
        }
        .item8 {
            margin: 10px 0;
        }
        .footer {
            height: 60px;
            background-color: #ccc;
            margin-top: 10px;
            line-height: 60px;
        }
    </style>
</head>

<body>
    <div class="containter">
        <!-- 头部 -->
        <div class="page-header clearfix">
            <div class="logo lefefix">
                logo
            </div>
            <div class="banner1 lefefix">
                banner1
            </div>
            <div class="banner2 lefefix">
                banner2
            </div>
        </div>
        <!-- 菜单 -->
        <div class="menu">menu</div>
        <div class="content clearfix">
            <!-- 左侧 -->
            <div class="left lefefix">
                <!-- 上 -->
                <div class="top clearfix">
                    <div class="item1 lefefix">栏目1</div>
                    <div class="item2 lefefix">栏目2</div>
                </div>
                <!-- 下 -->
                <div class="bottom clearfix">
                    <div class="item3 lefefix">栏目三</div>
                    <div class="item4 lefefix">栏目四</div>
                    <div class="item5 lefefix">栏目五</div>
                    <div class="item6 lefefix">栏目六</div>
                </div>
            </div>
            <!-- 右侧 -->
            <div class="right rightfix">
                <div class="item7">栏目七</div>
                <div class="item8">栏目八</div>
                <div class="item9">栏目九</div>
            </div>

        </div>
        <!-- 页脚 -->
        <div class="footer">
            页脚
        </div>
    </div>
</body>

</html>
