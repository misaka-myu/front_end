<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位的特殊应用</title>
    <style>
        .outer {
            height: 400px;
            background-color: #888;
            position: relative;
        }

        .inner {
            background-color: orange;
            font-size: 20px;
            padding: 20px;
            border: 10px black solid;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            /* 一个发生绝对定位的元素
                没有固体的宽和高,靠内容撑开
                还想充满整个父元素,那么就可以用上述方法
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
            */
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="inner">你好啊</div>
    </div>
</body>

</html>
