<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位的层级</title>
    <style>
        .outer {
            width: 500px;
            background-color: skyblue;
            border: 1px solid black;
            padding: 20px;
            position: relative;
            z-index: 11;
        }

        .box {
            width: 200px;
            height: 200px;
            font-size: 20px;

        }
        .box1 {
            background-color: #888;

        }
        /* 只有定位之后才可以谈层级 */

        .box2 {
            background-color: orange;
            position: relative;
            top: -150px;
            left: 50px;
            z-index: 0;
        }

        .box3 {
            background-color: green;
            position: absolute;
            top: 130px;
            left: 130px;
            z-index: 0;

        }

        /* 定位的元素比普通元素层级要高 */
        .box4 {
            background-color: red;
            position: fixed;
            top: 200px;
            left: 200px;
            z-index: 200;

        }
        .box5 {
            background-color: purple;
            position: fixed;
            top: 300px;
            left: 300px;
            z-index: 10;
        }
        /* 如果两者同时开启了定位,那么后来者压着前者,这时就跟书写顺序有关了 */
    </style>
</head>

<body>
    <div class="outer">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
    </div>
    <div class="box box5">5</div>
</body>

</html>
