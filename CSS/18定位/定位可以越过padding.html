<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位可以越过padding</title>
    <style>
        .outer {
            width: 800px;
            height: 600px;
            background-color: #888;
            padding: 20px;
            position: relative;
        }
        .inner {
            width: 200px;
            height: 200px;
            background-color: orange;
            position: absolute;
            /* 此时会越过父元素的内容区
                从padding的地方开始,
                不会穿透到border上,最多从padding
                开始
            */
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">

        </div>
    </div>
</body>
</html>
