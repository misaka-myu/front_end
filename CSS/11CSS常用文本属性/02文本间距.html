<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本间距</title>
    <style>
        div {
            font-size: 30px;
        }
        .atguigu2 {
            /* 字母之间的间隔
                包括汉字之间的间距
            */
            letter-spacing: 20px;
        }
        .atguigu3 {
            /* 字母之间的间隔
                包括汉字之间的间距
            */
            word-spacing: 20px;
        }
    </style>
</head>
<body>
    <div>Lorem ipsum dolor sit amet.尚硅谷1</div>
    <div class="atguigu1">Lorem ipsum dolor sit amet.尚 硅 谷 2</div>
    <div class="atguigu2">Lorem ipsum dolor sit amet.尚 硅 谷 3</div>
</body>
</html>
