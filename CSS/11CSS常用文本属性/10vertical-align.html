<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10_vertical_align</title>
    <style>
        div {
            font-size: 100px;
            height: 300px;
            background-color: skyblue;
        }

        span {
            font-size: 40px;
            background-color: orange;
            /* 位于底部 */
            /* vertical-align: bottom; */
            vertical-align: middle;
            /* middle 是使元素的中部与父元素的基线加上父元素x-height的一半对齐 */
        }

        img {
            height: 150px;
        }

        .test1 {
            width: 400px;
            height: 400px;
            background-color: gray;
        }

        .test2 {
            width: 100px;
            height: 100px;
            background-color: green;
            /* vertical-align: middle; */
            /* vertial-align只对行内元素生效,对块元素是无效的 */

        }
        .san {
            vertical-align: top;
        }
    </style>
</head>

<body>
    <div>
        atguigux尚硅谷x<span>x前端</span>
    </div>
    <hr>
    <div>
        atguigux尚硅谷x <img src="../../images/pet_01_dog.png" alt="小狗">
    </div>
    <!-- 反例,vertial-align只能调整父元素中子元素的对齐方式 -->
    <!-- <div class="test">
        123
    </div> -->
    <div class="test1">
        <div class="test2">

        </div>
    </div>
    <!-- vertial-align可以控制单元格里的对其方式 -->
    <table border="1" cellspacing="0">
        <caption>人员信息</caption>
        <thead>
            <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>性别</th>
            </tr>
        </thead>
        <tbody>
            <tr height="200px">
                <!-- <td valign="top">张三</td> -->
                <td class="san">张三</td>
                <td>18</td>
                <td>男</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>20</td>
                <td>女</td>
            </tr>
            <tr>
                <td>张三</td>
                <td>18</td>
                <td>男</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
