<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体复合属性</title>
    <style>
        .atguigu {
            /* 字体大小排在倒数第二位,字体族排在倒数第一位 其他属性应该往前写*/
            /* 如果第一个字体用不了会自动切换到第二个字体 */
            font: bold italic 100px "华文彩云","华文琥珀";
        }
    </style>
</head>
<body>
    <div class="atguigu">尚硅谷</div>
</body>
</html>
