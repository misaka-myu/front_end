<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03字体风格</title>
    <style>
        .atguigu1 {
            font-size: 100px;
            /* 正常字体样式 */
            font-style: normal;
        }

        .atguigu2 {
            font-size: 100px;
            /* 斜体 */
            font-style: italic;
        }

        .atguigu2 {
            font-size: 100px;
            /* 斜体 */
            font-style: oblique;
        }
    </style>
</head>

<body>
    <div class="atguigu1">尚硅谷1</div>
    <div class="atguigu2">尚硅谷2</div>
    <!-- 以下标签主要关注其语义 -->
    <!-- 使用CSS的话更关注其样式 -->
    <em>尚硅谷3</em>
    <i>尚硅谷4</i>
</body>

</html>
