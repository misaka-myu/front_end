<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体粗细</title>
    <style>
        div {
            font-size: 100px;
        }
        .atguigu1 {
            font-weight: lighter;
        }
        .atguigu2 {
            font-weight: normal;
        }
        .atguigu3 {
            font-weight: bold;
        }
        .atguigu4 {
            /* 默认的微软雅黑字体只有三种字体粗细程度 */
            font-weight: bolder;
        }
        .atguigu5 {
            /* font-weight可以直接写数值,是没有单位的 
                数值100-1000
                数值越大,字体越粗
                具体取决于字体设计时候的惊喜程度
                100-300约等于lighter
                400-500约等于normal
                600以上约等于bold
            */
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="atguigu1">尚硅谷1</div>
    <div class="atguigu2">尚硅谷2</div>
    <div class="atguigu3">尚硅谷3</div>
    <div class="atguigu4">尚硅谷4</div>
</body>
</html>
