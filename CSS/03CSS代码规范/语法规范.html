<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语法规范</title>
    <style>
        /* 这是一段CSS注释 */
        h1{
            color: green;
            font-size: larger;
            /* CSS最后一个属性值的后面可以不加分号，但是还是建议加上 */
        }
    </style>
</head>
<body>
    <!-- CSS语法由两部分组成，选择器和声明块，CSS语法格式由选择器，属性名和属性值组成，属性名和属性值并称为声明块 -->
    <h1>欢迎来到尚硅谷学习</h1>
</body>
</html>
