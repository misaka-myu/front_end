<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS中常用的长度单位</title>
    <style>
        html {
            font-size: 40px;
        }

        #d1 {
            /* 第一种长度单位,像素 */
            font-size: 40px;
            width: 400px;
            height: 400px;
            background-color: skyblue;

        }

        #d2 {
            /* 第二种长度单位:em相当于当前元素或其父元素的font-size的倍数 */

            /* font-size: 40px; */
            /* 一层一层往上找,如果找不到的话再使用默认的字体大小去乘以font-size */
            width: 10em;
            height: 10em;
            background-color: skyblue;

        }

        #d3 {
            /* 第三种长度单位:rem(相对于根元素的font-size) */

            /* font-size: 40px; */

            width: 10em;
            height: 10em;
            background-color: green;

        }

        #d4 {
            font-size: 40px;
            width: 400px;
            height: 400px;
            background-color: gray;
        }
        .inside {
            /* 第四种长度单位,相对于其父元素的百分比 */
            width: 50%;
            height: 25%;
            font-size: 150px;
            background-color: orange;
        }
        .test {
            font-size: 20px;
            text-indent: 2em;
        }
    </style>
</head>

<body>
    <div id="d1">1</div>
    <hr>
    <div id="d2">2</div>
    <hr>
    <div id="d3">2</div>
    <hr>
    <div id="d4">
        <div class="inside">4</div>

    </div>
    <hr>
    <div class="test">好好学习,天天向上</div>
</body>

</html>
