<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin的注意事项4</title>
    <style>
        div {
            width: 800px;
            height: 100px;
            background-color: deepskyblue;
            /* margin-left自动就是margin能距离左边有多远就多远 */
            /* margin-left: auto; */
            /* margin-right自动就是margin能距离右边有多远就多远 */
            /* margin-right: auto; */
            /* 如果margin-right和margin-left同时写的话,该元素就居中,在水平方向上 */
            /* 只是对于块级元素来说是这样的 */
        }
        span {
            background-color: red;
            /* 只有对块级元素才会生效,行内元素是不受其影响的 */
            /* margin: 0 auto; */
        }
    </style>
</head>
<body>
    <!-- margin的值也可以是auto,给一个块级元素左右margin设置auto可以实现该
        该元素在其父元素内水平居中.
    -->
    <div>你好啊</div>
    <!-- <span>你好呀</span> -->
</body>
</html>
