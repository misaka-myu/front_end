<!DOCTYPE html>
<html lang="zh-CN">
<!-- 
    有些样式会继承,元素如果本身设置了某个样式,就使用本身设置的样式,
    但是如果本身没有设置某个样式,会从父元素开始一级一级的继承(优先继承离得近的祖先元素)
    会继承的CSS属性
    字体属性
    文本属性(除了vertical-align)
    文字颜色
    不会继承的CSS属性
    边框
    背景
    内边距
    宽高
    溢出方式
    一个规律:能继承的属性,都是不影响布局的,简单数:都是和盒子模型没关系的

-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样式的继承</title>
    <link rel="stylesheet" href="./index.css">
    <style>
        body {
            font-size: 40px;
            color: yellow;
            font-weight: bold;
            /* 背景色是不可以继承的 */
            /* 背景色默认是透明的    */
        }

        #d1 {
            /* width: 600px; */
            height: 600px;
            background-color: gray;
            padding: 50px;
            font-size: 40px;
            color: yellow;
            font-weight: bold;
        }

        #d2 {
            height: 400px;
            padding: 50px;
            background-color: orange;
            font-size: 40px;
            color: yellow;
            font-weight: bold;
        }

        #d3 {
            height: 200px;
            background-color: green;
            /* font-size: 40px;
            color: yellow;
            font-weight: bold; */
        }
    </style>
</head>

<body>
    <div id="d1">
        <div id="d2">
            <!-- d3的文字样式继承自d2 -->
            <a href="https://www.baidu.com">去百度</a>
            <div id="d3" style="font-family: 隶书;">你好呀</div>
        </div>
    </div>
</body>

</html>
