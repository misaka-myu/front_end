<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin的注意事项5</title>
    <style>
        .box {
            height: 200px;
            width: 200px;

        }
        .box1 {
            background-color: skyblue;
        }
        .box2 {
            /* margin的值可以为负值 */
            margin-top: -50px;
            background-color: orange;
        }
        
    </style>
</head>

<body>
    <div class="box box1">1</div>
    <div class="box box2">2</div>
</body>

</html>
