<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素的默认样式</title>
    <style>
        body {
            /* 默认的margin是8px */
            margin: 0;
            
        }
        #d1 {
            color: orange;
            font-size: 50px;
        }
        a {
            color: black;
            text-decoration: none;

        }
    </style>
</head>

<body>
    <!-- 继承的样式优先级是最低的 -->
    <div id="d1">
        <a href="https://www.baidu.com">去百度</a>
        <span>你好呀</span>
    </div>
    <hr>
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <p>我是一个段落</p>
    <hr>
    <ul>
        <li>张三</li>
        <li>李四</li>
    </ul>

</body>

</html>
