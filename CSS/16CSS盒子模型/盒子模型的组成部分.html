<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>盒子模型的组成部分</title>
    <style>
        div {
            /* 内容区的宽 */
            width: 400px;
            /* 内容区的高 */
            height: 400px;
            /* 内边距 */
            /* 设置的背景色会填充内边距 */
            padding: 20px;
            background-color: gray;
            font-size: 40px;
            /* 边框 */
            /* 设置的背景色会填充边框区域 */
            border: 10px solid black;
            /* 最终看到的大小是padding + border + 内容区的大小 */
            /* 外边距 */
            /* margin是不影响盒子的大小的 */
            margin: 50px;
        }
    </style>
</head>
<body>
    <div>你好啊</div>
</body>
</html>
