<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色第三种表示之HEX或HEXA</title>
    <style>
        /* 前两组值是用来控制红色的,中间的两组值是用来控制绿色的,最后两组值是用来控制蓝色的 */
        /* .atguigu {
            color: #??????;
        } */
        .atguigu1 {
            color: #ff0000;
        }
        .atguigu2 {
            color: #00ff00;
        }
        .atguigu3 {
            color: #c7edcc;
        }
        /* HEXA 这里的A表示透明度 */
        .atguigu4 {
            color: #eeccbbdd;
            /* 这种表示完全不透明 */
        }
        /* 如果像上面这种情况的话,可以简写#ecbd,必须是两两重复 */ 
        .atguigu5 {
            color: #ecbd
        }
        /* ie浏览器不支持HEXA,只支持HEX */
    </style>
</head>
<body>
    <h2 class="atguigu1">尚硅谷</h2>
    <h2 class="atguigu2">尚硅谷</h2>
    <h2 class="atguigu3">尚硅谷</h2>
    <h2 class="atguigu4">尚硅谷</h2>
</body>
</html>
