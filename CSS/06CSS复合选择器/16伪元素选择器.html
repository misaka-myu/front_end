<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪元素选择器</title>
    <style>
        /* 伪元素选择器 */
        /* 什么是伪元素?很像元素,但不是元素(element)是元素中的一些特殊位置 */
        div::first-letter{
            color: red;
            font-size: 40px;
        }
        /* 选中的是第一行文字 */
        div::first-line{
            background-color: yellow;
        }
        /* 选中的是div标签中被选中的文字 */
        div::selection{
            background-color: green;
            color: orange;
        }
        /* 选中的是input中的提示文字 */
        input::placeholder{
            color: blue;
        }
        p::before{
            content: "￥";
        }
    </style>
</head>
<body>
    <div>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Reprehenderit eaque recusandae accusamus, cupiditate temporibus consequuntur nihil id dolorem repellendus excepturi? Magni numquam sunt ex? Delectus eum voluptatem nam minus sint.</div>
    <br>
    <!-- placeholder是用来提示用户输入的文字 -->
    <input type="text" placeholder="请输入您的用户名">
    <br>
    <p>199</p>
    <p>299</p>
    <p>399</p>
    <p>499</p>
</body>
</html>
