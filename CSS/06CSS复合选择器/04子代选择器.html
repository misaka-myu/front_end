<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子代选择器</title>
    <style>
        /* 子代选择器 */
        /* 这里的大于号表示的是子代选择器,这里的子只是指儿子 */
        div>a {
            color: red;
        }
        p > a{
            color: aqua;
        }
    </style>
</head>

<body>
    <div>
        <a href="#">张三</a>
        <a href="#">李四</a>
        <a href="#">王五</a>
        <p>
            <a href="#">赵六</a>
        </p>
    </div>
</body>

</html>
