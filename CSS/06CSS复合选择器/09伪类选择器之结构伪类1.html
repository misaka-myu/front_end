<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪类选择器之结构伪类</title>
    <style>
        /* 选中的是div的第一个儿子p元素-- 看结构1 */
        /* div>p:first-child{
            color: red;
        } */
        /* 选中的是div的第一个儿子p元素-- 看结构2 */
        /* div>p:first-child {
            color: red;
        } */
        /* 选中的是div元素的后代元素p且p的父元素是谁无所谓，但p必须是其父亲的第一个儿子 看结构三 */
        /* div p:first-child {
            color: red;
        } */
        /* p元素是不是其父元素的第一个子元素 看结构三 */
        p:first-child {
            color: red;
        }
    </style>
</head>

<body>
    <!-- 结构1  -->
    <!-- <div>
        <p>张三：98分</p>
        <p>李四：88分</p>
        <p>王五：78分</p>
        <p>赵六：68分</p>
    </div> -->

    <!-- 结构2  -->
    <!-- <div>
        <span>张三：98分</span>
        <p>李四：88分</p>
        <p>王五：78分</p>
        <p>赵六：68分</p>
    </div> -->
    <!-- 结构3 -->
    <p>测试1</p>
    <div>
        <p>测试2</p>
        <marquee>
            <p>测试3</p>
            <p>张三：98分</p>
        </marquee>

        <p>李四：88分</p>
        <p>王五：78分</p>
        <p>赵六：68分</p>
    </div>

</body>

</html>
