        /* div>p:nth-child(6){

        /* nth-last-child倒数第几个孩子 */

        div>p:nth-last-of-type(2) {
            color: red;
        }
        /* span是其父元素的唯一孩子 */
        /* span:only-child{
            color: red;

        /* 选中的是只有一种span类型的元素 */
        /* span:only-of-type{

        } */
         /* 选中的是html根元素 */
        /* :root{
            background-color: antiquewhite;
        } */
        /* html{
            background-color: aqua;
        } */
        /* 以上两者等价 */
        /* 选中的是没有内容的div元素 */
        div:empty{
            color: red;
            width: 40px;
            height: 20px;
            background-color: aqua;
        }
    </style>
</head>
