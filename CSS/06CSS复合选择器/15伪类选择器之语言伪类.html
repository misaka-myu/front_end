<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15伪类选择器之语言伪类</title>
    <style>
        div:lang(en){
            color: red;
        }
        div:lang(zh-CN){
            color: green;
        }
        /* 只要lang属性是zh-CN就可以 */
        :lang(zh-CN){
            color: green;
        }
    </style>
</head>
<body>
    <div>尚硅谷</div>
    <div lang="en">atguigu</div>
    <p>前端</p>
    <span>你好</span>
</body>
</html>
