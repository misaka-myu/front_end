<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>否定伪类</title>
    <style>
        /* 选中的是div的儿子p元素,但是排除类名为fail的元素 */
        /* div>p:not(.fail){
            color: red;
        } */
        /* 选中div元素的子元素,但是要排除以title属性等于"你要加油"开头的使用元素选择器 */
        /* div>p:not([title^="你要加油"]){
            color: red;
        } */
        div>p:not(:first-child) {
            color: red;
        }
    </style>
</head>

<body>
    <div>
        <span>测试</span>
        <p>张三：98分</p>
        <p>李四：88分</p>
        <p>王五：78分</p>
        <p>赵六：68分</p>
        <p class="fail" title="你要加油啊 ">孙七：58分</p>
        <p class="fail" title="你要加油啊 ">老八：48分</p>
    </div>
</body>

</html>
