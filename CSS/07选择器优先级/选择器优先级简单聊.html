<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器优先级</title>
    <style>
        /* 选择器必须是同类型的才能实现后来者居上 */
        /* id选择器 > 类选择器  > 元素选择器 > 通配选择器 */
        #atguigu{
            color: brown;
        }
        .slogan{
            color: red;
        }
        h2{
            color: green;
        }
        *{
            color: yellow;
        }
    </style>
</head>
<body>
    <h2 id="atguigu" class="slogan">尚硅谷让天下没有难学的技术</h2>
</body>
</html>
